name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --all-groups
      - run: uv run pytest -q
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=34
      - run: uv run ruff check src tests
      - run: uv run basedpyright
      - run: uv run python -m compileall -q src
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: node --check public/app.js
      - run: node --check src/public_worker.js
      - run: bash -n scripts/*.sh

  browser-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: https://hidden-conviction.aotwone.workers.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-v013-artifacts
          path: |
            playwright-report
            test-results
