[project]
name = "hidden-conviction"
version = "0.14.0"
description = "SEC filing signal engine for Hidden Conviction Score"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
]

[dependency-groups]
dev = [
  "workers-py==1.17.4",
  "workers-runtime-sdk==1.8.4",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
  "basedpyright==1.40.1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["src/build_meta.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 34
